name: Run tests and upload coverage

on:
  push:

jobs:
  test:
    name: Run TUnit tests and collect coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test --configuration Release --no-build --coverage --coverage-output-format cobertura

      - name: Find coverage files
        run: find . -name "coverage.cobertura.xml" -print

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./tests/**/TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: true